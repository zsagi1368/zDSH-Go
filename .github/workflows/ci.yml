name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality gate (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm 11.7.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build host library
        run: pnpm run build:lib:host

      - name: Build client library
        run: pnpm run build:lib:client

      - name: Unit tests (vitest)
        run: pnpm run test
        timeout-minutes: 45

      - name: Lint (oxlint)
        run: pnpm run lint:contracts-ready

      - name: Docs gate
        run: pnpm run test:docs
